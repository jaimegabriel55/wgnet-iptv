cat << 'EOF' > .github/workflows/build-apk.yml
name: Compilar APK WGNet IPTV

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Compilar APK en modo Debug
        run: flutter build apk --debug

      - name: Subir APK generada como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-wgnet-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
EOF
